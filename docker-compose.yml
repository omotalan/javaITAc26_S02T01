services:
  mysql-db:
    image: mysql:8.4
    container_name: java-itac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: rootitac
      MYSQL_DATABASE: java_itac_db
      MYSQL_USER: student
      MYSQL_PASSWORD: studentitac
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
